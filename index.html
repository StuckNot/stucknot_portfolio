:root{--ink:#000;--paper:#fff;--accent:#ac0d30;--muted:#4f4f4d}
:root{--accent-on-dark:color-mix(in srgb, var(--accent) 55%, white)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);background:#e7e4e0;line-height:1.45;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@page{size:297mm 210mm;margin:0}
.mono,.lbl{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.lbl{font-size:var(--fs-label);font-weight:600;text-transform:uppercase;letter-spacing:.06em;line-height:1.3}
.ar{width:1em;height:1em;display:inline-block;vertical-align:-.12em;margin-left:.4em}

/* ---------- Sheet: designed on a 1122 x 793 px canvas (A4 landscape) and scaled ---------- */
.sheet{
  container-type:inline-size;position:relative;
  width:min(1122px,100%);aspect-ratio:297/210;margin:28px auto;
  background:var(--paper);overflow:hidden;scroll-margin-top:72px;
  border-radius:3px;
  --px:calc(100cqw / 1122);
  --rule:max(1px,calc(1.5 * var(--px)));
  --fs-title:calc(92 * var(--px));
  --fs-name:calc(32 * var(--px));
  --fs-name-lg:calc(60 * var(--px));
  --fs-tagline:calc(18 * var(--px));
  --fs-tagline-lg:calc(24 * var(--px));
  --fs-desc:calc(16.5 * var(--px));
  --fs-desc-lg:calc(19 * var(--px));
  --fs-label:calc(11.5 * var(--px));
  --fs-mono:calc(16 * var(--px));
  --radius:calc(10 * var(--px));
}
.page{position:absolute;inset:0;padding:calc(30 * var(--px));display:flex;flex-direction:column}
.grid{flex:1;min-height:0;display:grid;gap:calc(1 * var(--px));background:#e4e1dc;border:var(--rule) solid #e4e1dc}
.cell{background:var(--paper);min-width:0;min-height:0}

/* ---------- Buttons and chips ---------- */
.btn{
  display:inline-flex;align-items:center;white-space:nowrap;
  background:var(--ink);color:var(--paper);text-decoration:none;
  padding:calc(13 * var(--px)) calc(20 * var(--px));border-radius:calc(8 * var(--px));
  border:none;font-weight:600;
}
.btn.accent{background:var(--accent);color:#fff}
.btn.light{background:var(--paper);color:var(--ink);border:var(--rule) solid var(--ink)}
.btn.ghost{background:transparent;color:var(--paper);border:var(--rule) solid var(--paper)}
.tag{display:inline-block;padding:calc(4 * var(--px)) calc(10 * var(--px));border-radius:999px;border:max(1px,calc(1.3 * var(--px))) solid var(--muted);color:var(--muted)}
.tag.live{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- Window (the screenshot frame) ---------- */
.win{border-radius:var(--radius);overflow:hidden;background:var(--paper);box-shadow:0 calc(10*var(--px)) calc(30*var(--px)) rgba(0,0,0,.14);border:var(--rule) solid #e4e1dc}
.win-bar{height:max(26px,calc(32 * var(--px)));background:#f4f2ef;display:flex;align-items:center;gap:calc(8 * var(--px));padding:0 calc(12 * var(--px));border-bottom:var(--rule) solid #e4e1dc}
.sq{width:max(7px,calc(9 * var(--px)));height:max(7px,calc(9 * var(--px)));border-radius:50%;background:#d7d3cd;flex:none}
.addr{flex:1;min-width:0;height:calc(22 * var(--px));min-height:18px;background:var(--paper);color:var(--ink);border-radius:999px;padding:0 calc(12 * var(--px));display:flex;align-items:center;font-size:calc(11.5 * var(--px));font-weight:500;white-space:nowrap;overflow:hidden;border:var(--rule) solid #e4e1dc}
.addr a,.addr span{overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.addr a{color:var(--ink)}
.addr span{color:var(--muted)}
.shot{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:#f4f2ef}
.shot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;text-align:center;padding:0 8%;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:max(11px,calc(14 * var(--px)));font-weight:600;color:var(--muted)}
.shot .ph small{font-size:max(10px,calc(12 * var(--px)));font-weight:400;color:var(--muted)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#fff}
.feat .win .shot{aspect-ratio:16/10}

/* ---------- Phone collage (mobile-app projects — the image already is the full composition) ---------- */
.phones{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:0 calc(10*var(--px)) calc(30*var(--px)) rgba(0,0,0,.14)}
.phones .shot{aspect-ratio:16/10;background:var(--accent-wash, var(--accent))}
.feat .phones .shot{aspect-ratio:4/3}
.phones .tag{position:absolute;top:calc(14*var(--px));left:calc(14*var(--px));background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.5);color:#fff;backdrop-filter:blur(4px)}

/* ---------- Cover ---------- */
.cover .grid{grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr auto}
.c-brand{display:flex;align-items:center;padding:calc(18 * var(--px)) calc(28 * var(--px))}
.mark{font-size:calc(24 * var(--px));font-weight:800;letter-spacing:-.01em;line-height:1}
.mark img{display:block;height:calc(32 * var(--px))}
.mark .stuck{color:var(--accent)}
.mark .not{color:var(--muted)}
.c-meta{display:flex;justify-content:space-between;align-items:center;gap:calc(16 * var(--px));padding:calc(18 * var(--px)) calc(28 * var(--px))}
.c-title{display:flex;flex-direction:column;justify-content:flex-end;padding:calc(34 * var(--px)) calc(34 * var(--px)) calc(38 * var(--px))}
.c-title h1{font-size:var(--fs-title);font-weight:800;line-height:.95;letter-spacing:-.025em}
.c-title h1 span{display:block}
.c-title p{margin-top:calc(26 * var(--px));font-size:calc(19 * var(--px));line-height:1.5;max-width:26em;color:var(--muted)}
.c-right{display:grid;grid-template-rows:1fr auto;gap:calc(1*var(--px));background:#e4e1dc;min-height:0}
.term{background:#15110f;color:#f3efe9;padding:calc(26 * var(--px));font-family:"JetBrains Mono",ui-monospace,monospace;font-size:var(--fs-mono);line-height:1.8;overflow:hidden}
.term .p{color:var(--accent-on-dark)}
.term .dim{color:#938c84}
.ln{display:block;white-space:nowrap;overflow:hidden;width:0;animation:type calc(var(--n) * 28ms) steps(var(--n)) var(--d) forwards}
@keyframes type{to{width:calc(var(--n) * 1ch)}}
.cursor{display:inline-block;width:.6em;height:1.05em;background:var(--accent);vertical-align:-.2em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.static .ln{animation:none;width:auto}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:calc(1*var(--px));background:#e4e1dc}
.thumb{display:block;background:var(--paper);overflow:hidden}
.thumb .shot{aspect-ratio:16/9}
.thumb .ph small{display:none}
.thumb:last-child:nth-child(odd){grid-column:1/-1}
.thumb:last-child:nth-child(odd) .shot{aspect-ratio:32/9}
.marq{grid-column:1/-1;background:#15110f;color:var(--accent-on-dark);padding:calc(12 * var(--px)) calc(28 * var(--px));white-space:nowrap;overflow:hidden}

/* ---------- Index ---------- */
.index .grid{grid-template-rows:auto 1fr}
.i-head{background:#15110f;color:#f3efe9;display:flex;justify-content:space-between;align-items:center;padding:calc(18 * var(--px)) calc(28 * var(--px));font-size:var(--fs-mono)}
.i-head .p{color:var(--accent-on-dark)}
.i-body{display:flex;flex-direction:column;background:var(--paper);min-height:0}
.i-row{display:grid;grid-template-columns:calc(60 * var(--px)) 1fr calc(150 * var(--px)) calc(90 * var(--px)) calc(130 * var(--px)) calc(70 * var(--px));align-items:center;
  padding:0 calc(28 * var(--px));border-bottom:var(--rule) solid #ece9e4;text-decoration:none;flex:1 1 0;max-height:calc(96 * var(--px));min-height:0}
.i-body::after{content:"";flex:1 1 0;min-height:0;background:#faf9f7}
.i-row.hd{flex:none;height:calc(42 * var(--px));color:var(--muted)}
.i-row .nm{font-size:calc(23 * var(--px));font-weight:700;letter-spacing:-.01em;line-height:1.1;padding-right:calc(16 * var(--px))}
.i-row:last-of-type{border-bottom:var(--rule) solid #ece9e4}
.i-row .pg{justify-self:end;display:flex;align-items:center;color:var(--muted)}
a.i-row:hover{background:#faf6f3}

/* ---------- Project pages ---------- */
.p-head{grid-column:1/-1;background:#15110f;color:#f3efe9;display:flex;justify-content:space-between;align-items:center;padding:calc(13 * var(--px)) calc(28 * var(--px));font-size:calc(12.5 * var(--px))}
.p-head .p{color:var(--accent-on-dark)}
.pair{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
.single{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.proj{display:flex;flex-direction:column;padding:calc(28 * var(--px)) calc(28 * var(--px)) calc(26 * var(--px));background:color-mix(in srgb, var(--accent-wash, var(--accent)) 4%, var(--paper))}
.proj .win,.proj .phones{margin-right:calc(8 * var(--px))}
.proj .info{margin-top:calc(22 * var(--px))}
.idx{color:var(--accent-wash, var(--muted))}
.name{font-size:var(--fs-name);font-weight:700;letter-spacing:-.015em;line-height:1.08}
.tagline{margin-top:calc(6 * var(--px));font-size:var(--fs-tagline);font-style:italic;font-weight:500;color:var(--accent)}
.desc{margin-top:calc(10 * var(--px));font-size:var(--fs-desc);line-height:1.45;max-width:34em;color:var(--muted)}
.act{margin-top:auto;padding-top:calc(20 * var(--px));display:flex;justify-content:space-between;align-items:flex-end;gap:calc(16 * var(--px))}
.meta{display:flex;gap:calc(26 * var(--px))}
.meta dt{color:var(--muted);font-size:calc(10.5 * var(--px))}
.meta dd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:calc(13.5 * var(--px));font-weight:600}
.proj .act .btn.accent,.feat .act .btn.accent{background:var(--accent-wash, var(--accent))}
.feat{display:grid;grid-template-columns:1.7fr 1fr;gap:calc(36 * var(--px));padding:calc(26 * var(--px)) calc(32 * var(--px)) calc(30 * var(--px)) calc(30 * var(--px));background:color-mix(in srgb, var(--accent-wash, var(--accent)) 5%, var(--paper))}
.feat .win,.feat .phones{margin-right:0;height:100%;display:flex;flex-direction:column;justify-content:center}
.feat .win .shot,.feat .phones .shot{flex:none;width:100%}
.feat>div{display:flex;flex-direction:column;justify-content:center;height:100%}
.feat .name{font-size:var(--fs-name-lg);line-height:1}
.feat .tagline{font-size:var(--fs-tagline-lg);margin-top:calc(10*var(--px))}
.feat .desc{font-size:var(--fs-desc-lg);margin-top:calc(16 * var(--px))}
.feat .act{display:block;margin-top:calc(26 * var(--px));padding-top:0}
.feat .meta{margin-bottom:calc(24 * var(--px))}

/* ---------- Closing ---------- */
.closing{background:#15110f;color:#f3efe9}
.closing .grid{background:var(--paper);border-color:var(--paper);grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr auto}
.closing .cell{background:#15110f}
.k-main{grid-row:1/3;display:flex;flex-direction:column;justify-content:space-between;padding:calc(32 * var(--px)) calc(34 * var(--px))}
.k-main h2{font-size:calc(58 * var(--px));font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:calc(22 * var(--px))}
.k-main p{margin-top:calc(22 * var(--px));font-size:calc(19 * var(--px));line-height:1.5;max-width:24em;color:#c9c3bb}
.k-main .term{padding:0;font-size:calc(14 * var(--px));line-height:1.5;background:transparent}
.k-main .btns{display:flex;gap:calc(18 * var(--px));flex-wrap:wrap;margin-top:calc(26 * var(--px))}
.k-contact{padding:calc(28 * var(--px)) calc(32 * var(--px));display:grid;gap:calc(16 * var(--px));align-content:center}
.k-contact dt{color:#9b948b;font-size:calc(10.5 * var(--px))}
.k-contact dd{font-size:calc(21 * var(--px));font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.k-contact a{text-decoration:none}
.k-tag{background:var(--accent)!important;color:#fff;padding:calc(28 * var(--px)) calc(32 * var(--px));display:flex;flex-direction:column;justify-content:center}
.k-tag div{font-size:calc(46 * var(--px));font-weight:800;line-height:1.05;letter-spacing:-.015em}
.closing .marq{background:var(--paper);color:var(--accent);grid-column:1/-1}

/* ---------- Web-only top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:#15110f;color:#f3efe9;border-bottom:var(--rule,1px) solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.bar .mark{font-size:17px}
.bar nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font:inherit;cursor:pointer;background:transparent;color:#d9d4cc;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 13px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .btn{padding:8px 14px;font-size:12px;border-radius:999px}
@media (hover:hover){
  .btn{transition:transform .12s,opacity .12s}
  .btn:hover{opacity:.88}
  .chip:hover{border-color:rgba(255,255,255,.4)}
}
@media (prefers-reduced-motion:reduce){.ln{animation:none;width:auto}.cursor{animation:none}.btn{transition:none}html{scroll-behavior:auto}}

/* ---------- Phones: same content, stacked ---------- */
@media screen and (max-width:760px){
  body{background:var(--paper)}
  .bar{position:static;padding:12px 16px;gap:10px}
  .bar nav{flex-basis:100%;order:3}
  .p-head span:last-child{white-space:nowrap;margin-left:12px}
  .sheet{
    aspect-ratio:auto;margin:0;width:100%;--px:.62px;border-bottom:var(--rule) solid #e4e1dc;border-radius:0;
    --fs-title:15cqw;--fs-name:26px;--fs-name-lg:30px;--fs-tagline:16px;--fs-tagline-lg:17px;--fs-desc:16px;--fs-desc-lg:17px;--fs-label:11px;--fs-mono:13px;
  }
  .page{position:static;padding:16px}
  .grid{display:flex;flex-direction:column}
  .cover .grid,.index .grid,.pair,.single,.closing .grid{display:flex;flex-direction:column}
  .c-brand,.c-meta{padding:14px 16px}
  .c-title{padding:30px 18px}
  .c-right{display:flex;flex-direction:column}
  .term{font-size:13px;padding:20px}
  .ln{white-space:normal}
  .thumbs{grid-template-columns:1fr 1fr}
  .marq{padding:10px 16px;font-size:11px}
  .i-row{grid-template-columns:34px 1fr auto auto;gap:0 8px;padding:14px 16px;max-height:none;flex:none}
  .i-body::after{display:none}
  .i-row .cat,.i-row .yr{display:none}
  .i-row .nm{font-size:18px}
  .i-row .st{justify-self:end}
  .i-row .pg{white-space:nowrap}
  .i-row.hd .cat,.i-row.hd .yr{display:none}
  .proj{padding:20px 16px}
  .feat{display:flex;flex-direction:column;align-items:stretch;padding:20px 16px;gap:22px}
  .feat .win,.feat .phones{height:auto;display:block}
  .feat>div{height:auto;display:block}
  .feat .shot,.feat .phones .shot{aspect-ratio:16/10;flex:none}
  .act{flex-wrap:wrap}
  .btn{padding:12px 16px}
  .k-main{padding:24px 18px}
  .k-main h2{font-size:11.5cqw}
  .k-main p{font-size:17px}
  .k-contact,.k-tag{padding:24px 18px}
  .k-contact dd{font-size:19px}
  .k-tag div{font-size:32px}
  .p-head{padding:10px 16px;font-size:11px}
}

/* ---------- Print: one sheet per A4 landscape page ---------- */
@media print{
  html,body{background:#fff}
  .bar{display:none}
  .sheet{width:297mm;height:210mm;aspect-ratio:auto;margin:0;break-after:page;page-break-after:always;break-inside:avoid;border-radius:0}
  .sheet:last-of-type{break-after:auto;page-break-after:auto}
  .ln{animation:none!important;width:auto!important}
  .cursor{animation:none!important}
  .btn{transition:none}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"></div>

<script>
(function(){
  const P = PORTFOLIO;
  const T = Object.assign({ink:"#000000",paper:"#ffffff",accent:"#ac0d30",muted:"#4f4f4d"}, P.theme || {});
  Object.keys(T).forEach(k => document.documentElement.style.setProperty("--" + k, T[k]));

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const shortUrl = u => String(u).replace(/^https?:\/\//, "").replace(/\/$/, "");
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const pad = n => String(n).padStart(2, "0");
  const AR = '<svg class="ar" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>';
  const live = p => !!p.url;
  document.title = P.company + " – " + P.titleLines.join(" ");

  const ALL = "All";
  let active = ALL, firstRender = true;
  const cats = [...new Set(P.projects.map(p => p.category).filter(Boolean))];

  function shot(p){
    const ph = '<div class="ph">Screenshot goes here<small>' + esc(p.image || "screenshots/your-file.jpg") + '</small></div>';
    const img = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + ' screenshot" onerror="this.remove()">' : "";
    return ph + img;
  }

  function win(p, idx){
    if (p.type === "mobile") {
      const tag = '<span class="tag lbl">' + esc(p.category || "Mobile app") + '</span>';
      return '<figure class="phones">' + tag + '<div class="shot">' + shot(p) + '</div></figure>';
    }
    const bar = live(p)
      ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(shortUrl(p.url)) + '</a>'
      : '<span>On request</span>';
    const body = live(p)
      ? '<a class="shot" href="' + esc(p.url) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">' + shot(p) + '</a>'
      : '<div class="shot">' + shot(p) + '</div>';
    return '<figure class="win"><div class="win-bar"><i class="sq"></i><i class="sq"></i><i class="sq"></i><div class="addr">' + bar + '</div></div>' + body + '</figure>';
  }

  function meta(p){
    const m = [["Category", p.category], ["Year", p.year]].filter(x => x[1]);
    return m.length ? '<dl class="meta">' + m.map(x => '<div><dt class="lbl">' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>').join("") + '</dl>' : "<span></span>";
  }
  const action = p => live(p)
    ? '<a class="btn accent lbl" href="' + esc(p.url) + '" target="_blank" rel="noopener">View live' + AR + '</a>'
    : '<span class="tag lbl">Available on request</span>';

  const tagline = p => p.tagline ? '<p class="tagline">' + esc(p.tagline) + '</p>' : "";
  const info = (p, idx, total) => '<div class="info"><span class="lbl idx">' + pad(idx) + ' / ' + pad(total) + '</span>' +
    '<h2 class="name">' + esc(p.name) + '</h2>' + tagline(p) + '<p class="desc">' + esc(p.description) + '</p></div>';
  const proj = (p, idx, total) => '<article class="cell proj" style="--accent-wash:' + esc(p.accent || T.accent) + '">' + win(p, idx) + info(p, idx, total) + '<div class="act">' + meta(p) + action(p) + '</div></article>';
  const feat = (p, idx, total) => '<article class="cell feat" style="--accent-wash:' + esc(p.accent || T.accent) + '">' + win(p, idx) + '<div>' + info(p, idx, total) + '<div class="act">' + meta(p) + action(p) + '</div></div></article>';

  const wordmark = P.logo ? '<img src="' + esc(P.logo) + '" alt="' + esc(P.company) + '">'
    : '<span class="stuck">' + esc(P.company.replace(/not$/i, "")) + '</span><span class="not">' + esc(P.company.slice(-3)) + '</span>';
  const strip = (P.tagline || []).join(" · ").toUpperCase();
  const marq = '<div class="marq lbl">' + esc(strip + "  ·  " + strip + "  ·  " + strip + "  ·  " + strip) + '</div>';

  function render(){
    const list = active === ALL ? P.projects : P.projects.filter(p => p.category === active);

    // Pagination: featured = 1 per page, others = 2 per page
    const groups = []; let pending = [];
    list.forEach(p => {
      if (p.featured) { if (pending.length) { groups.push(pending); pending = []; } groups.push([p]); }
      else { pending.push(p); if (pending.length === 2) { groups.push(pending); pending = []; } }
    });
    if (pending.length) groups.push(pending);
    const total = groups.length + 3;
    const pageOf = new Map();
    groups.forEach((g, i) => g.forEach(p => pageOf.set(p, i + 3)));

    const nLive = list.filter(live).length, nPriv = list.length - nLive;
    const sheet = (n, cls, inner) => '<section class="sheet ' + cls + '" id="page-' + n + '"><div class="page">' + inner + '</div></section>';

    // --- Cover: terminal output is generated from the data below
    const lines = [
      ['<span class="p">root@stucknot:~$</span> npm run portfolio', "root@stucknot:~$ npm run portfolio"],
      ['<span class="dim">&gt; Starting portfolio...</span>', "> Starting portfolio..."],
      ['&gt; ' + list.length + ' project' + (list.length === 1 ? "" : "s") + ' found', "> " + list.length + " project" + (list.length === 1 ? "" : "s") + " found"],
      ['&gt; ' + nLive + ' live' + (nPriv ? ', ' + nPriv + ' on request' : ''), "> " + nLive + " live" + (nPriv ? ", " + nPriv + " on request" : "")],
      ['<span class="p">&gt; Ready.</span><span class="cursor"></span>', "> Ready."]
    ];
    let delay = 0.5;
    const term = '<div class="term' + (firstRender ? "" : " static") + '">' + lines.map(l => {
      const n = l[1].length, d = delay; delay += n * 0.028 + 0.25;
      return '<span class="ln" style="--n:' + n + ';--d:' + d.toFixed(2) + 's">' + l[0] + '</span>';
    }).join("") + '</div>';
    const thumbs = list.slice(0, 4).map(p => '<a class="thumb" href="#page-' + pageOf.get(p) + '" tabindex="-1" aria-hidden="true"><div class="shot">' + shot(p) + '</div></a>').join("");
    const cover = sheet(1, "cover",
      '<div class="grid">' +
        '<div class="cell c-brand"><div class="mark">' + wordmark + '</div></div>' +
        '<div class="cell c-meta lbl"><span>' + esc(P.edition) + '</span><span>' + list.length + ' project' + (list.length === 1 ? "" : "s") + '</span></div>' +
        '<div class="cell c-title"><h1>' + P.titleLines.map(l => '<span>' + esc(l) + '</span>').join("") + '</h1><p>' + esc(P.intro) + '</p></div>' +
        '<div class="c-right">' + term + '<div class="thumbs">' + thumbs + '</div></div>' +
        marq +
      '</div>');

    // --- Index
    const rows = list.map((p, i) =>
      '<a class="i-row" href="#page-' + pageOf.get(p) + '"><span class="mono lbl">' + pad(i + 1) + '</span><span class="nm">' + esc(p.name) + '</span>' +
      '<span class="lbl cat">' + esc(p.category || "") + '</span><span class="mono lbl yr">' + esc(p.year || "") + '</span>' +
      '<span class="st"><span class="tag lbl' + (live(p) ? " live" : "") + '">' + (live(p) ? "Live" : "On request") + '</span></span>' +
      '<span class="pg lbl">p.' + pageOf.get(p) + AR + '</span></a>').join("");
    const index = sheet(2, "index",
      '<div class="grid"><div class="cell i-head mono"><span><span class="p">root@stucknot:~$</span> ls ./projects</span><span>' + list.length + ' item' + (list.length === 1 ? "" : "s") + '</span></div>' +
      '<div class="i-body"><div class="i-row hd lbl"><span>#</span><span>Project</span><span class="cat">Category</span><span class="yr">Year</span><span>Status</span><span style="justify-self:end">Page</span></div>' + rows + '</div></div>');

    // --- Project pages
    const pages = groups.map((g, i) => {
      const n = i + 3, single = g.length === 1 && g[0].featured;
      const head = '<div class="p-head mono"><span><span class="p">root@stucknot:~/projects$</span> ' + (single ? "cat " + slug(g[0].name) : "ls") + '</span><span>' + n + ' / ' + total + '</span></div>';
      const body = single ? feat(g[0], list.indexOf(g[0]) + 1, list.length) : g.map(p => proj(p, list.indexOf(p) + 1, list.length)).join("");
      return sheet(n, "", '<div class="grid ' + (single ? "single" : "pair") + '">' + head + body + '</div>');
    }).join("");

    // --- Closing
    const hire = P.hireUrl || P.website;
    const contact = [];
    if (P.website) contact.push(["Website", '<a href="' + esc(P.website) + '" target="_blank" rel="noopener">' + esc(shortUrl(P.website)) + '</a>']);
    if (P.email) contact.push(["Email", '<a href="mailto:' + esc(P.email) + '">' + esc(P.email) + '</a>']);
    if (P.instagram) {
      const handle = P.instagram.replace(/^@/, "").trim();
      contact.push(["Instagram", '<a href="https://www.instagram.com/' + esc(handle) + '/" target="_blank" rel="noopener">' + esc(P.instagram) + '</a>']);
    }
    const closing = sheet(total, "closing",
      '<div class="grid">' +
        '<div class="cell k-main"><div class="term"><span class="ln" style="width:auto"><span class="p">root@stucknot:~$</span> ./start-project</span></div>' +
          '<div><h2>' + esc(P.closing.heading) + '</h2><p>' + esc(P.closing.text) + '</p>' +
          '<div class="btns"><a class="btn accent lbl" href="' + esc(hire) + '" target="_blank" rel="noopener">Hire talent' + AR + '</a></div></div></div>' +
        '<dl class="cell k-contact">' + contact.map(r => '<div><dt class="lbl">' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join("") + '</dl>' +
        '<div class="cell k-tag">' + (P.tagline || []).map(w => '<div>' + esc(w) + '.</div>').join("") + '</div>' +
        marq +
      '</div>');

    document.getElementById("app").innerHTML = cover + index + pages + closing;
    firstRender = false;
  }

  function renderBar(){
    const chips = cats.length > 1
      ? '<nav aria-label="Filter projects">' + [ALL].concat(cats).map(c => '<button class="chip lbl" type="button" data-c="' + esc(c) + '" aria-pressed="' + (c === active) + '">' + esc(c) + '</button>').join("") + '</nav>'
      : '<nav></nav>';
    document.getElementById("bar").innerHTML =
      '<div class="bar"><div class="mark">' + esc(P.company) + '</div>' + chips +
      (P.pdfUrl ? '<a class="btn ghost lbl" href="' + esc(P.pdfUrl) + '" download>Download PDF</a>' : "") +
      '<a class="btn accent lbl" href="' + esc(P.hireUrl || P.website) + '" target="_blank" rel="noopener">Hire talent' + AR + '</a></div>';
    document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.c)));
  }
  function setFilter(c){ active = c; renderBar(); render(); window.scrollTo({top:0}); }

  // Print always shows every project, whatever filter is active on screen
  let restore = null;
  window.addEventListener("beforeprint", () => { if (active !== ALL) { restore = active; active = ALL; render(); } });
  window.addEventListener("afterprint", () => { if (restore) { active = restore; restore = null; render(); } });

  renderBar(); render();
})();
</script>
</body>
</html>
